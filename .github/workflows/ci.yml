name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tests (macOS)
        run: swift test
      - name: Build for iOS
        run: xcodebuild -scheme WuloPayCheckout -destination 'generic/platform=iOS' build
